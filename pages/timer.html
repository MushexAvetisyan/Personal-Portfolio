<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flipclock/0.7.8/flipclock.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/3.3.7/css/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/css/timer.css">
</head>
<body>
<div class="pomodoro">
    <div class="row">
        <div class="col-md-6">
            <div class="row"><p>session length<p></div>
            <div class="row counter">
                <div class="col-md-4">
                    <button class="btn btn-default" id="sessDec">-</button>
                </div>
                <div class="col-md-2">
                    <div id="session">25</div>
                </div>
                <div class="col-md-4">
                    <button class="btn btn-default" id="sessInc">+</button>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="row"><p>break length<p></div>
            <div class="row counter">
                <div class="col-md-4">
                    <button class="btn btn-default" id="breakDec">-</button>
                </div>
                <div class="col-md-2">
                    <div id="break">5</div>
                </div>
                <div class="col-md-4">
                    <button class="btn btn-default" id="breakInc">+</button>
                </div>
            </div>
        </div>
    </div>

    <div id="clock" class="row">
        <div class="timer"><div class="middle"></div></div>
    </div>
    <div class="row" id="statRow">
        <div id="stats"></div>
    </div>
    <div class="container">
        <div class="row" id="btns">
            <button class="btn btn-default btn-lg" id="start">start</button>
            <button class="btn btn-default btn-lg" id="stop">stop</button>
            <button class="btn btn-default btn-lg" id="clear">clear</button>
        </div>
    </div>
</div>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/flipclock/0.7.8/flipclock.min.js"></script>
<script>
    $(document).ready(function(){
        let countS = 1;
        $("#session").html(countS);
        let countB = 1;
        $("#break").html(countB);
        let pos = "Just Do It";
        let countLama;
        let posLama;
        let count;
        $("#stats").html(pos);
        let clock = $(".timer").FlipClock(0, {
            countdown: true,
            clockFace: 'MinuteCounter',
            autoStart: false,
            callbacks: {
                interval: function(){
                    if (clock.getTime() === 0){
                        if (pos === "session"){
                            clock.setTime(countB*60);
                            clock.start();
                            pos = "break";
                            $("#stats").html(pos);
                        } else if (pos === "break"){
                            clock.setTime(countS*60);
                            clock.start();
                            pos = "session";
                            $("#stats").html(pos);
                        }
                    }
                }
            }
        })
        //SESSION
        $("#sessInc").on("click", function(){
            if ($("#session").html() > 0){
                countS = parseInt($("#session").html());
                countS+=1;
                $("#session").html(countS);
                //clock.setTime(countS*60);
            }
        });
        $("#sessDec").on("click", function(){
            if ($("#session").html() > 1){
                countS = parseInt($("#session").html());
                countS-=1;
                $("#session").html(countS);
                //clock.setTime(countS*60);
            }
        });
        //BREAK
        $("#breakInc").on("click", function(){
            if ($("#break").html() > 0){
                countB = parseInt($("#break").html());
                countB+=1;
                $("#break").html(countB);
            }
        });
        $("#breakDec").on("click", function(){
            if ($("#break").html() > 1){
                countB = parseInt($("#break").html());
                countB-=1;
                $("#break").html(countB);
            }
        });
        $("#start").on("click", function(){
            if (count != countS || clock.getTime()==0){
                clock.setTime(countS*60);
                pos="Session";
                $("#stats").html(pos);
            } else {
                pos = posLama;
                $("#stats").html(pos);
            }
            count = countS;
            clock.start();
        });
        $("#stop").on("click", function(){
            clock.stop();
            countLama = clock.getTime();
            posLama = $("#stats").html();
        });
        $("#clear").on("click", function(){
            clock.stop();
            pos = "Do it Again";
            $("#stats").html(pos);
            clock.setTime(0);
        });
    });
</script>
</body>
</html>
